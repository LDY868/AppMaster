<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AppMaster</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="top">
      <div class="brand-block">
        <p class="brand">AppMaster</p>
        <p class="tagline">Mobile Outsource Studio · desktop shell</p>
      </div>
      <div class="conn" id="connStatus" data-state="idle">
        <span class="dot"></span>
        <span id="connLabel">Agent offline</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel intake" aria-labelledby="intakeHeading">
        <div class="panel-head">
          <h1 id="intakeHeading">Intake</h1>
          <p>选择题配置订单；答案写入 <code>config.json</code>。</p>
        </div>

        <label class="field">
          <span>Project ID</span>
          <input id="projectId" type="text" value="coffee-demo" autocomplete="off" />
        </label>
        <label class="field">
          <span>需求简述</span>
          <textarea id="brief" rows="3" placeholder="例如：咖啡点单 App，客人自助下单取餐…"></textarea>
        </label>

        <div id="questions" class="questions"></div>

        <div class="actions">
          <button type="button" class="btn ghost" id="btnLoad">加载题库</button>
          <button type="button" class="btn primary" id="btnSaveRun">保存并启动</button>
        </div>
      </section>

      <section class="panel side" aria-label="Progress and gates">
        <div class="panel-head">
          <h2>阶段进度</h2>
          <p>Orchestrator 只编排；专项 Owner 产出。</p>
        </div>
        <ol id="stages" class="stages"></ol>

        <div class="gate-box" id="gateBox" hidden>
          <h3>人工闸门 <span id="gateId"></span></h3>
          <p id="gateSummary"></p>
          <button type="button" class="btn primary" id="btnApprove">批准继续</button>
        </div>

        <div class="panel-head tight">
          <h2>产物预览</h2>
        </div>
        <ul id="artifacts" class="artifacts"></ul>
        <pre id="preview" class="preview" aria-live="polite">选择产物以预览…</pre>
      </section>
    </main>

    <footer class="foot">
      <section class="cred" aria-label="Credentials and connection">
        <p class="cred-title">凭证与连接</p>
        <p id="keyStatus">API key: —</p>
        <label class="field inline">
          <span>CURSOR_API_KEY</span>
          <input id="apiKey" type="password" placeholder="仅写入安全存储 / 环境变量" autocomplete="off" />
        </label>
        <div class="actions">
          <button type="button" class="btn ghost" id="btnSaveKey">保存密钥</button>
          <button type="button" class="btn ghost" id="btnClearKey">清除</button>
          <button type="button" class="btn ghost" id="btnConnect">连接 / 拉起 serve</button>
        </div>
      </section>
      <pre id="log" class="log" aria-label="Agent log"></pre>
    </footer>

    <script src="app.js" type="module"></script>
  </body>
</html>
